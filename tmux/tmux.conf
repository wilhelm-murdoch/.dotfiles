unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on
# A program that resets its cursor gets this shape back, so the block keeps
# blinking after Neovim exits. The default reset is a steady block.
set -g cursor-style blinking-block

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme: wilhelm.codes, see design/tmux/wilhelm-codes.conf in the wilhelm.codes repo
set -g status-right "#[align=absolute-centre]#[fg=#e3e3de]#W#{?client_prefix,#[fg=#ff6369],#[fg=#32d74b]}.#[align=right]#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#[fg=#8b8b84]#S#[none] "
set -g status-style "bg=#1e1f22,fg=#1e1f22"
set -g window-status-current-format "#{?client_prefix,#[fg=#ff6369],#[fg=#32d74b]}󱓻"
set -g window-status-format "#[bg=#1e1f22,fg=#3c3f43]󱓻"
set -g status-left ' '
set-window-option -g pane-border-style "fg=#2c2e31"
set-window-option -g pane-active-border-style "fg=#32d74b"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
